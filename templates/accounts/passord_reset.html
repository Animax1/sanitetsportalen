{% load static %}
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nytt passord – Sanitetsportalen</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background: #0f172a; color: #e5e7eb; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; }
  .login-card { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; }
  .login-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.25rem; }
  .login-sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
  .form-control { background: #1e293b !important; color: #e5e7eb !important; border-color: #334155 !important; }
  /* Bootstraps ::placeholder er laget for lys bakgrunn og forsvinner mot
     det mørke feltet. Samme tone som --text-soft ellers i portalen:
     dimmere enn innhold, men lesbar. */
  .form-control::placeholder { color: #64748b !important; }
  .form-control:focus { box-shadow: 0 0 0 0.2rem rgba(59,130,246,0.2) !important; border-color: #3b82f6 !important; }
  .form-label { color: #cbd5e1; font-size: 0.85rem; font-weight: 600; }
  .alert-danger { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; font-size: 0.85rem; }
<div class="login-card">
  <div class="login-title"><i class="bi bi-shield-lock me-2"></i>Nytt passord</div>
  <div class="login-sub">
    Velg et nytt passord for <strong>{{ bruker.username }}</strong>.
  </div>

  {% if form.errors %}
    <div class="alert alert-danger">
      {% for felt in form %}{% for feil in felt.errors %}{{ feil }}<br>{% endfor %}{% endfor %}
    </div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="id_new_password1">Velg et passord</label>
      {{ form.new_password1 }}
      <div class="form-text">
        Minst 8 tegn. Kan ikke være for likt brukernavnet, et vanlig passord eller kun tall.
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_new_password2">Gjenta passordet</label>
      {{ form.new_password2 }}
    </div>
    <button type="submit" class="btn btn-primary w-100">Lagre nytt passord</button>
  </form>
</div>
</body>
</html>
