# Testene, mot PostgreSQL og med node — ved hver push til staging og main.
#
# Hvorfor dette finnes (26. sep. 2026, D1 i docs/PLAN_TEKNISK_GJELD_2026-09-25.md):
# suiten kjørte bare lokalt, på SQLite, og rundt 160 JS-tester hoppet over seg
# selv uten node. En feil som bare finnes i PostgreSQL (A3: en databasefeil i en
# signalmottaker som veltet stemplingen) var grønn lokalt og rød i prod.
#
# Bare staging og main (André, 26. sep. 2026): arbeidet går alltid via staging,
# så det er der CI svarer — før noe går videre til main. CI stopper ikke Railway
# av seg selv; «vent på grønne sjekker» for main er en innstilling i Railway.
#
# Stegene er de samme som kommandoblokka i CLAUDE.md, og skal holdes like.
#
# **Tre jobber side om side, ikke tre steg etter hverandre** (19. okt. 2026).
# Stegene var 143 s + 329 s + 83 s i serie mot lokal PostgreSQL; veggtida er nå
# den tregeste av de tre. `core` kjøres parallelt som resten siden testene fikk
# én backupmappe per prosess (`core.test_helpers.prosessmappe`). Prisen er at
# PostgreSQL og avhengighetene settes opp tre ganger, om lag ett minutt hver.
# `fail-fast: false`: en rød `core` skal ikke skjule hvordan modulene gikk.
name: Tester

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester:
    name: tester (${{ matrix.del }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - del: moduler
            kommando: python manage.py test patients accounts audit statistikk oppdrag vaktliste ko backlog park myproject --noinput -v 1 --parallel 4
          - del: core
            kommando: python manage.py test core --noinput -v 1 --parallel 4
          - del: prover
            kommando: python manage.py verifiser_migrasjoner

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Migrasjonsprøvene lager og sletter sin egen engangsbase på samme server.
      MIGRASJONSPROVE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Bare for testene. settings.py krever minst 50 tegn.
      SECRET_KEY: ci-bare-for-testene-ikke-en-hemmelighet-0123456789abcdef
      DEBUG: 'True'
      # En JS-test uten node skal feile, ikke hoppe over (patients/js_test_utils.py).
      KREV_NODE: '1'

    steps:
      - uses: actions/checkout@v4

      # **Samme offisielle image, fra tre registre etter hverandre** (14. okt. 2026).
      # Runnerne deler IP-er, og hvert register har en grense for anonyme
      # nedlastinger: Docker Hub stoppet CI to ganger før 9. okt., AWS-speilet to
      # ganger 13.–14. okt. («toomanyrequests: Data limit exceeded») — hver gang før
      # en test kjørte, og Railway hoppet over bygget. En tjenestecontainer har ingen
      # reserve, derfor et eget steg. Ikke apt: imaget er det Railway kjører, med
      # samme locale og standardinnstillinger, og det er hele grunnen til at CI
      # kjører PostgreSQL (André valgte dette 14. okt.).
      #
      # Klar-sjekken går over **TCP**: imaget starter først en midlertidig server
      # som bare lytter på socketen mens det setter opp basen, og den ville svart
      # «klar» før den ekte serveren er oppe.
      - name: PostgreSQL 18 (som Railway — server-status viste 18.6, 26. sep. 2026)
        run: |
          BILDE=""
          for kandidat in public.ecr.aws/docker/library/postgres:18 \
                          mirror.gcr.io/library/postgres:18 \
                          docker.io/library/postgres:18; do
            for forsok in 1 2; do
              if docker pull -q "$kandidat"; then BILDE="$kandidat"; break 2; fi
              echo "::warning::Fikk ikke $kandidat (forsøk $forsok)"
              sleep 5
            done
          done
          if [ -z "$BILDE" ]; then
            echo "::error::Ingen av de tre registrene ga PostgreSQL-imaget"
            exit 1
          fi
          echo "PostgreSQL fra $BILDE"
          docker run -d --name postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 "$BILDE"
          for i in $(seq 1 60); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U postgres -q; then break; fi
            sleep 1
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres
          docker exec postgres psql -U postgres -h 127.0.0.1 -tAc 'select version()'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # som runtime.txt
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Avhengighetene, låst med hasher som på Railway
        run: pip install --require-hashes -r requirements.txt -r requirements-ci.txt

      - name: Django-sjekk og manglende migrasjoner
        if: matrix.del == 'prover'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Statiske filer (manifestet noen tester leser)
        run: python manage.py collectstatic --noinput -v 0

      - name: ${{ matrix.del }}
        run: ${{ matrix.kommando }}

      # Kjente sårbarheter i de låste avhengighetene (sikkerhetsgjennomgangen
      # 28. sep. 2026). Sist, så en ny CVE ikke skjuler testresultatene — og rød,
      # fordi det er poenget: en sårbarhet skal oppdages ved neste push, ikke ved
      # neste gjennomgang. Revisjonen leser `requirements.txt` med hashene, altså
      # nøyaktig det Railway installerer, ikke CI-miljøet med verktøyene i.
      # pip-audit selv installeres uten hasher: den er et CI-verktøy med et stort
      # avhengighetstre, den kjøres ikke i prod, og versjonen er festet.
      - name: Kjente sårbarheter (pip-audit)
        if: matrix.del == 'prover'
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --require-hashes --disable-pip --progress-spinner off
